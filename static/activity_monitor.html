<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Activity Monitor - PustakVerse</title>
    <link rel="icon" type="image/png" href="/static/PustakVerse.png">
    <link rel="stylesheet" href="/static/style.css">
    <script>
        (function() {
            try {
                const theme = localStorage.getItem('pustakverse_theme') || 'light';
                if (theme === 'dark') document.documentElement.classList.add('dark-theme');
                else if (theme === 'sepia') document.documentElement.classList.add('sepia-theme');
            } catch(e) {}
        })();
    </script>
    <style>
        :root {
            --am-bg: #0b0f19;
            --am-card: #131b2e;
            --am-card-hover: #19233c;
            --am-text: #f8fafc;
            --am-muted: #94a3b8;
            --am-border: #1e293b;
            --am-accent: #6366f1;
            --am-accent-glow: rgba(99, 102, 241, 0.25);
            --am-success: #10b981;
            --am-danger: #ef4444;
            --am-warning: #f59e0b;
            --am-cyan: #06b6d4;
            --am-purple: #a855f7;
        }
        .dark-theme {
            --am-bg: #090d16;
            --am-card: #0f172a;
            --am-card-hover: #1e293b;
            --am-text: #f8fafc;
            --am-muted: #94a3b8;
            --am-border: #1e293b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--am-bg);
            color: var(--am-text);
            min-height: 100vh;
            line-height: 1.5;
        }

        /* ── CUSTOM SLEEK SCROLLBAR FOR ALL CARDS, TABLES & SECTIONS ── */
        * {
            scrollbar-width: thin;
            scrollbar-color: #6366f1 #1e293b;
        }
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.7);
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #6366f1, #a855f7);
            border-radius: 8px;
            border: 2px solid rgba(15, 23, 42, 0.8);
        }
        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(180deg, #4f46e5, #9333ea);
        }

        /* ── PIN GATE ── */
        .pin-gate {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            background: radial-gradient(circle at top, #1e1b4b 0%, #0f172a 70%, #020617 100%);
        }
        .pin-card {
            background: var(--am-card);
            border: 1px solid var(--am-border);
            border-radius: 24px;
            padding: 48px 40px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 60px rgba(0,0,0,0.5), 0 0 40px var(--am-accent-glow);
        }
        .pin-card h1 { font-size: 1.7rem; font-weight: 800; margin-bottom: 8px; color: #fff; }
        .pin-card p { color: var(--am-muted); margin-bottom: 28px; font-size: 0.95rem; }
        .pin-card .lock-icon { font-size: 3.2rem; margin-bottom: 16px; filter: drop-shadow(0 0 12px #6366f1); }
        .pin-inputs { display: flex; gap: 8px; justify-content: center; margin-bottom: 24px; }
        .pin-inputs input {
            width: 44px;
            height: 54px;
            text-align: center;
            font-size: 1.4rem;
            font-weight: 800;
            border: 2px solid var(--am-border);
            border-radius: 12px;
            background: rgba(15, 23, 42, 0.8);
            color: #fff;
            outline: none;
            transition: all 0.2s;
        }
        .pin-inputs input:focus {
            border-color: var(--am-accent);
            box-shadow: 0 0 16px var(--am-accent-glow);
            transform: scale(1.05);
        }
        .pin-btn {
            width: 100%;
            padding: 14px;
            font-size: 1rem;
            font-weight: 700;
            color: #fff;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
        }
        .pin-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(99,102,241,0.5);
        }
        .pin-error {
            color: #fca5a5;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 10px;
            border-radius: 10px;
            font-size: 0.9rem;
            margin-bottom: 18px;
            font-weight: 600;
        }

        /* ── DASHBOARD HEADER ── */
        .am-header {
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 60%, #4338ca 100%);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 20px 36px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(12px);
        }
        .am-header-left { display: flex; align-items: center; gap: 14px; }
        .am-header-left h1 { font-size: 1.45rem; font-weight: 800; display: flex; align-items: center; gap: 10px; }
        .am-live-pill {
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid rgba(16, 185, 129, 0.4);
            color: #34d399;
            font-size: 0.76rem;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
            70% { box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
        .am-header-actions { display: flex; align-items: center; gap: 12px; }
        .am-header-actions a, .am-header-actions button {
            padding: 9px 18px;
            border-radius: 10px;
            font-size: 0.88rem;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.2s;
            cursor: pointer;
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .am-back { background: rgba(255, 255, 255, 0.12); color: #fff; border: 1px solid rgba(255, 255, 255, 0.15) !important; }
        .am-back:hover { background: rgba(255, 255, 255, 0.22); }
        .am-logout { background: rgba(239, 68, 68, 0.85); color: #fff; }
        .am-logout:hover { background: #dc2626; transform: translateY(-1px); }

        /* ── BODY & METRICS GRID ── */
        .am-body {
            max-width: 1440px;
            margin: 0 auto;
            padding: 28px 24px 80px;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 18px;
            margin-bottom: 28px;
        }
        .stat-card {
            background: var(--am-card);
            border: 1px solid var(--am-border);
            border-radius: 18px;
            padding: 22px 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.25);
            transition: transform 0.2s, border-color 0.2s;
            position: relative;
            overflow: hidden;
        }
        .stat-card:hover {
            transform: translateY(-3px);
            border-color: var(--am-accent);
        }
        .stat-card::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 3px;
            background: linear-gradient(90deg, var(--am-accent), var(--am-purple));
        }
        .stat-card .stat-icon { font-size: 2.2rem; margin-bottom: 6px; }
        .stat-card .stat-num { font-size: 2.1rem; font-weight: 900; line-height: 1.1; color: #fff; }
        .stat-card .stat-label { color: var(--am-muted); font-size: 0.86rem; margin-top: 5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }

        /* ── ROLE PILLS BAR ── */
        .role-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 28px;
            background: var(--am-card);
            border: 1px solid var(--am-border);
            border-radius: 16px;
            padding: 14px 20px;
            align-items: center;
        }
        .role-bar-title { font-size: 0.85rem; font-weight: 700; color: var(--am-muted); margin-right: 6px; }
        .role-pill {
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .role-developer { background: rgba(168, 85, 247, 0.18); color: #c084fc; border: 1px solid rgba(168, 85, 247, 0.35); }
        .role-official { background: rgba(59, 130, 246, 0.18); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.35); }
        .role-author { background: rgba(16, 185, 129, 0.18); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.35); }
        .role-reader { background: rgba(148, 163, 184, 0.15); color: #cbd5e1; border: 1px solid rgba(148, 163, 184, 0.3); }

        /* ── DUAL COLUMN GRID FOR HIGHLIGHTS ── */
        .am-two-col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 22px;
            margin-bottom: 26px;
        }
        @media (max-width: 1024px) {
            .am-two-col { grid-template-columns: 1fr; }
        }

        /* ── SECTION CARD WITH DEDICATED SCROLL BAR ── */
        .am-section {
            background: var(--am-card);
            border: 1px solid var(--am-border);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 26px;
            box-shadow: 0 4px 25px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
        }
        .am-section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 18px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--am-border);
        }
        .am-section-header h2 {
            font-size: 1.22rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #fff;
        }
        .section-count-badge {
            background: rgba(99, 102, 241, 0.2);
            color: #818cf8;
            border: 1px solid rgba(99, 102, 241, 0.4);
            border-radius: 12px;
            font-size: 0.75rem;
            padding: 2px 10px;
            font-weight: 800;
        }

        .am-search {
            width: 100%;
            max-width: 360px;
            padding: 10px 16px;
            border: 1px solid var(--am-border);
            border-radius: 12px;
            font-size: 0.9rem;
            background: rgba(15, 23, 42, 0.85);
            color: #fff;
            outline: none;
            transition: all 0.2s;
        }
        .am-search:focus {
            border-color: var(--am-accent);
            box-shadow: 0 0 14px var(--am-accent-glow);
        }

        /* ── DEDICATED SCROLLABLE TABLE CONTAINERS ── */
        .am-scroll-box {
            overflow-x: auto;
            overflow-y: auto;
            max-height: 480px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            background: rgba(11, 15, 25, 0.5);
            -webkit-overflow-scrolling: touch;
        }
        .am-scroll-box-short {
            max-height: 360px;
        }
        .am-scroll-box-tall {
            max-height: 600px;
        }

        /* ── TABLES ── */
        .am-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.88rem;
            text-align: left;
        }
        .am-table th {
            background: #0f172a;
            color: #94a3b8;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.74rem;
            letter-spacing: 0.6px;
            padding: 12px 14px;
            border-bottom: 2px solid var(--am-border);
            white-space: nowrap;
            position: sticky;
            top: 0;
            z-index: 2;
        }
        .am-table td {
            padding: 12px 14px;
            border-bottom: 1px solid rgba(30, 41, 59, 0.8);
            vertical-align: middle;
        }
        .am-table tr:hover td {
            background: rgba(99, 102, 241, 0.07);
        }

        /* ── BADGES & STATUS INDICATORS ── */
        .badge {
            padding: 4px 10px;
            border-radius: 10px;
            font-size: 0.76rem;
            font-weight: 700;
            text-transform: capitalize;
            display: inline-block;
        }
        .badge-developer { background: rgba(168, 85, 247, 0.2); color: #c084fc; border: 1px solid rgba(168, 85, 247, 0.4); }
        .badge-official { background: rgba(59, 130, 246, 0.2); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.4); }
        .badge-author { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.4); }
        .badge-reader { background: rgba(148, 163, 184, 0.15); color: #cbd5e1; border: 1px solid rgba(148, 163, 184, 0.3); }

        .status-online {
            color: #34d399;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .status-online::before {
            content: '';
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 8px #10b981;
        }
        .status-offline {
            color: var(--am-muted);
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .status-offline::before {
            content: '';
            width: 8px;
            height: 8px;
            background: #64748b;
            border-radius: 50%;
        }

        .metric-pill {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 3px 8px;
            font-size: 0.78rem;
            font-weight: 700;
            display: inline-block;
        }
        .metric-pill-green {
            background: rgba(16, 185, 129, 0.15);
            border-color: rgba(16, 185, 129, 0.35);
            color: #34d399;
        }
        .metric-pill-blue {
            background: rgba(59, 130, 246, 0.15);
            border-color: rgba(59, 130, 246, 0.35);
            color: #60a5fa;
        }
        .metric-pill-purple {
            background: rgba(168, 85, 247, 0.15);
            border-color: rgba(168, 85, 247, 0.35);
            color: #c084fc;
        }

        /* ── PAGINATION CONTROLS ── */
        .am-pagination {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-top: 16px;
            flex-wrap: wrap;
        }
        .am-pagination button {
            padding: 6px 14px;
            border: 1px solid var(--am-border);
            border-radius: 8px;
            background: rgba(15, 23, 42, 0.7);
            color: var(--am-text);
            cursor: pointer;
            font-size: 0.82rem;
            font-weight: 700;
            transition: all 0.15s;
        }
        .am-pagination button:hover {
            border-color: var(--am-accent);
            background: rgba(99, 102, 241, 0.2);
        }
        .am-pagination button.active {
            background: var(--am-accent);
            color: #fff;
            border-color: var(--am-accent);
            box-shadow: 0 0 10px var(--am-accent-glow);
        }

        .am-footer {
            text-align: center;
            padding: 30px;
            color: var(--am-muted);
            font-size: 0.84rem;
            border-top: 1px solid var(--am-border);
            margin-top: 40px;
        }

        /* ── RISK & SECURITY INTELLIGENCE STYLES ── */
        .badge-risk-critical { background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.5); color: #f87171; font-weight: 800; animation: pulseRed 2s infinite; }
        .badge-risk-high { background: rgba(249, 115, 22, 0.2); border: 1px solid rgba(249, 115, 22, 0.5); color: #fb923c; font-weight: 700; }
        .badge-risk-medium { background: rgba(234, 179, 8, 0.2); border: 1px solid rgba(234, 179, 8, 0.5); color: #facc15; font-weight: 700; }
        @keyframes pulseRed {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 6px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .security-flag-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 3px 9px;
            border-radius: 6px;
            font-size: 0.74rem;
            font-weight: 700;
            margin: 2px;
        }
        .flag-critical { background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.3); }
        .flag-warning { background: rgba(245, 158, 11, 0.2); color: #fde68a; border: 1px solid rgba(245, 158, 11, 0.3); }
        .flag-danger { background: rgba(220, 38, 38, 0.25); color: #f87171; border: 1px solid rgba(220, 38, 38, 0.4); }

        /* ── READING TELEMETRY PILLS & BUTTONS ── */
        .reading-pill-active {
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(99, 102, 241, 0.35);
            color: #a5b4fc;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.78rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            max-width: 250px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .reading-pill-done {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.35);
            color: #6ee7b7;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.78rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .btn-read-history {
            background: rgba(99, 102, 241, 0.2);
            border: 1px solid rgba(99, 102, 241, 0.4);
            color: #c7d2fe;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.76rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .btn-read-history:hover {
            background: #6366f1;
            color: #fff;
            transform: translateY(-1px);
        }

        /* ── MODALS ── */
        .am-modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(2, 6, 23, 0.85);
            backdrop-filter: blur(8px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .am-modal-card {
            background: var(--am-card);
            border: 1px solid var(--am-border);
            border-radius: 20px;
            width: 100%;
            max-width: 680px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 60px rgba(0,0,0,0.6);
            overflow: hidden;
            animation: modalPop 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes modalPop {
            0% { transform: scale(0.95); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .am-modal-header {
            padding: 18px 24px;
            border-bottom: 1px solid var(--am-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(15, 23, 42, 0.5);
        }
        .am-modal-body {
            padding: 24px;
            overflow-y: auto;
            flex: 1;
        }

        /* ── PROGRESS BAR STYLING ── */
        .progress-bar-bg {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 999px;
            height: 6px;
            width: 100%;
            overflow: hidden;
            margin-top: 4px;
        }
        .progress-bar-fill {
            background: linear-gradient(90deg, #6366f1, #10b981);
            height: 100%;
            border-radius: 999px;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>


<!-- ═══════════ PIN ENTRY GATE & 3-MONTH LOCKOUT ═══════════ -->
<div class="pin-gate">
    
    <!-- ── STANDARD PIN ENTRY GATE ── -->
    <div class="pin-card">
        <div class="lock-icon">🔐</div>
        <h1>Activity Monitor</h1>
        <p>Restricted Access — Enter the 8-digit PIN (<code>ACTIVITY_MONITOR_PIN</code>)</p>

        

        <form method="POST" id="pinForm">
            <div class="pin-inputs">
                
                <input type="text" name="pin_1" id="pin_1" maxlength="1" inputmode="numeric" pattern="[0-9]" autocomplete="off" required>
                
                <input type="text" name="pin_2" id="pin_2" maxlength="1" inputmode="numeric" pattern="[0-9]" autocomplete="off" required>
                
                <input type="text" name="pin_3" id="pin_3" maxlength="1" inputmode="numeric" pattern="[0-9]" autocomplete="off" required>
                
                <input type="text" name="pin_4" id="pin_4" maxlength="1" inputmode="numeric" pattern="[0-9]" autocomplete="off" required>
                
                <input type="text" name="pin_5" id="pin_5" maxlength="1" inputmode="numeric" pattern="[0-9]" autocomplete="off" required>
                
                <input type="text" name="pin_6" id="pin_6" maxlength="1" inputmode="numeric" pattern="[0-9]" autocomplete="off" required>
                
                <input type="text" name="pin_7" id="pin_7" maxlength="1" inputmode="numeric" pattern="[0-9]" autocomplete="off" required>
                
                <input type="text" name="pin_8" id="pin_8" maxlength="1" inputmode="numeric" pattern="[0-9]" autocomplete="off" required>
                
            </div>
            <button type="submit" class="pin-btn">Verify &amp; Enter Activity Monitor</button>
            <div style="margin-top: 20px;">
                <a href="/dashboard" style="color: var(--am-muted); text-decoration: none; font-size: 0.88rem; font-weight: 600;">← Back to Dashboard</a>
            </div>
        </form>
    </div>

    <script>
    (function(){
        const inputs = document.querySelectorAll('.pin-inputs input');
        inputs.forEach((inp, i) => {
            inp.addEventListener('input', function() {
                this.value = this.value.replace(/\D/g, '').slice(0,1);
                if (this.value && i < inputs.length - 1) inputs[i+1].focus();
            });
            inp.addEventListener('keydown', function(e) {
                if (e.key === 'Backspace' && !this.value && i > 0) { inputs[i-1].focus(); inputs[i-1].value = ''; }
            });
            inp.addEventListener('paste', function(e) {
                e.preventDefault();
                const text = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g, '').slice(0,8);
                for (let j = 0; j < text.length && j < inputs.length; j++) { inputs[j].value = text[j]; }
                if (text.length > 0) inputs[Math.min(text.length, inputs.length) - 1].focus();
            });
        });
        if (inputs[0]) inputs[0].focus();
    })();
    </script>
    
</div>
