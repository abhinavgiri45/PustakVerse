<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="100%" height="100%" style="font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="buyerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <linearGradient id="authorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="authorBankGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <linearGradient id="devGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <linearGradient id="devBankGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>

    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>

    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="8" flood-color="#10b981" flood-opacity="0.4"/>
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f97316"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#a855f7"/>
    </marker>
    <marker id="arrowSlate" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="660" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>

  <!-- Top Title Banner -->
  <g transform="translate(40, 24)">
    <rect width="880" height="64" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="24" y="28" fill="#38bdf8" font-size="11" font-weight="800" letter-spacing="1.5">PUSTAKVERSE PAYMENT ROUTING HIERARCHY</text>
    <text x="24" y="49" fill="#f8fafc" font-size="16" font-weight="700">Exact Settlement Flow During Reader Book Checkout</text>
    <rect x="740" y="16" width="120" height="32" rx="16" fill="#065f46" stroke="#10b981" stroke-width="1.5"/>
    <text x="800" y="37" fill="#a7f3d0" font-size="12" font-weight="800" text-anchor="middle">✓ 0% COMMISSION</text>
  </g>

  <!-- 1. BUYER ENTRY POINT -->
  <g id="nodeBuyer" transform="translate(320, 115)" filter="url(#shadow)">
    <rect width="320" height="52" rx="26" fill="url(#buyerGrad)" stroke="#60a5fa" stroke-width="2"/>
    <text x="160" y="27" fill="#ffffff" font-size="14" font-weight="800" text-anchor="middle">🛒 Reader Clicks 'Pay with Razorpay'</text>
    <text x="160" y="43" fill="#bfdbfe" font-size="11" font-weight="500" text-anchor="middle">Initiates Secure One-Time Checkout</text>
  </g>

  <!-- Path: Buyer to CheckKeys -->
  <path d="M 480 167 L 480 205" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrowBlue)"/>

  <!-- 2. DECISION DIAMOND: CheckKeys -->
  <g id="nodeCheckKeys" transform="translate(480, 260)" filter="url(#shadow)">
    <!-- Diamond shape polygon -->
    <polygon points="0,-48 190,0 0,48 -190,0" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5"/>
    <text x="0" y="-12" fill="#38bdf8" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="1">GATEWAY ROUTING CHECK</text>
    <text x="0" y="8" fill="#f8fafc" font-size="13" font-weight="700" text-anchor="middle">Does Author have Razorpay Keys?</text>
    <text x="0" y="26" fill="#94a3b8" font-size="11" font-weight="500" text-anchor="middle">(books.rp_key_id OR user profile keys)</text>
  </g>

  <!-- ================= LEFT PATH: AUTHOR DIRECT ROUTE ================= -->
  <!-- Connector Left -->
  <path d="M 290 260 L 175 260 L 175 320" fill="none" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <!-- Branch Label YES -->
  <rect x="185" y="244" width="95" height="22" rx="6" fill="#065f46" stroke="#10b981" stroke-width="1.2"/>
  <text x="232" y="259" fill="#a7f3d0" font-size="10.5" font-weight="800" text-anchor="middle">YES (Keys Set)</text>

  <!-- Author Gateway Node -->
  <g id="nodeAuthorGateway" transform="translate(45, 330)" filter="url(#shadow)">
    <rect width="260" height="74" rx="12" fill="url(#authorGrad)" stroke="#34d399" stroke-width="2"/>
    <text x="130" y="26" fill="#ffffff" font-size="13" font-weight="800" text-anchor="middle">⚡ Author's Personal Gateway</text>
    <text x="130" y="44" fill="#ecfdf5" font-size="11" font-weight="600" text-anchor="middle">Checkout uses Author's Razorpay Account</text>
    <text x="130" y="60" fill="#d1fae5" font-size="10" font-weight="500" text-anchor="middle">Zero platform middleman intervention</text>
  </g>

  <!-- Path: Author Gateway to Author Bank -->
  <path d="M 175 404 L 175 440" fill="none" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrowGreen)"/>

  <!-- Author Bank Node (100% Direct Deposit) -->
  <g id="nodeAuthorBank" transform="translate(40, 450)" filter="url(#glowGreen)">
    <rect width="270" height="90" rx="14" fill="url(#authorBankGrad)" stroke="#6ee7b7" stroke-width="2.5"/>
    <rect x="65" y="10" width="140" height="20" rx="10" fill="#064e3b"/>
    <text x="135" y="24" fill="#6ee7b7" font-size="10" font-weight="800" text-anchor="middle">100% DIRECT EARNINGS</text>
    <text x="135" y="52" fill="#ffffff" font-size="14" font-weight="800" text-anchor="middle">🏦 Author's Bank Account</text>
    <text x="135" y="70" fill="#a7f3d0" font-size="11.5" font-weight="600" text-anchor="middle">Deposited Directly into Author Bank</text>
    <text x="135" y="83" fill="#d1fae5" font-size="9.5" text-anchor="middle">(Minus standard 2% + GST gateway fee)</text>
  </g>


  <!-- ================= RIGHT PATH: DEVELOPER / PLATFORM FALLBACK ================= -->
  <!-- Connector Right -->
  <path d="M 670 260 L 785 260 L 785 320" fill="none" stroke="#f97316" stroke-width="2.5" marker-end="url(#arrowOrange)"/>
  <!-- Branch Label NO -->
  <rect x="680" y="244" width="95" height="22" rx="6" fill="#7c2d12" stroke="#ea580c" stroke-width="1.2"/>
  <text x="727" y="259" fill="#ffedd5" font-size="10.5" font-weight="800" text-anchor="middle">NO (No Keys)</text>

  <!-- Developer Gateway Node -->
  <g id="nodeDevGateway" transform="translate(655, 330)" filter="url(#shadow)">
    <rect width="260" height="74" rx="12" fill="url(#devGrad)" stroke="#fdba74" stroke-width="2"/>
    <text x="130" y="26" fill="#ffffff" font-size="13" font-weight="800" text-anchor="middle">🛡️ Platform / Fallback Gateway</text>
    <text x="130" y="44" fill="#fff7ed" font-size="11" font-weight="600" text-anchor="middle">Routes via Platform Developer Gateway</text>
    <text x="130" y="60" fill="#fed7aa" font-size="10" font-weight="500" text-anchor="middle">(front_page_settings.rp_key_id)</text>
  </g>

  <!-- Path: Dev Gateway to Dev Bank -->
  <path d="M 785 404 L 785 440" fill="none" stroke="#f97316" stroke-width="2.5" marker-end="url(#arrowOrange)"/>

  <!-- Dev Bank Node -->
  <g id="nodeDevBank" transform="translate(650, 450)" filter="url(#shadow)">
    <rect width="270" height="90" rx="14" fill="url(#devBankGrad)" stroke="#fdba74" stroke-width="2"/>
    <rect x="65" y="10" width="140" height="20" rx="10" fill="#7c2d12"/>
    <text x="135" y="24" fill="#fed7aa" font-size="10" font-weight="800" text-anchor="middle">PLATFORM RESERVES</text>
    <text x="135" y="52" fill="#ffffff" font-size="14" font-weight="800" text-anchor="middle">🏛️ Platform / Dev Account</text>
    <text x="135" y="70" fill="#fed7aa" font-size="11.5" font-weight="600" text-anchor="middle">Deposited into Platform Account</text>
    <text x="135" y="83" fill="#ffedd5" font-size="9.5" text-anchor="middle">(For unclaimed titles or platform books)</text>
  </g>


  <!-- ================= CENTER PATH: OPTIONAL READER DONATION ================= -->
  <!-- Dotted path from Buyer down to Donation Check -->
  <path d="M 480 308 L 480 348" fill="none" stroke="#a855f7" stroke-dasharray="4 4" stroke-width="2" marker-end="url(#arrowPurple)"/>

  <!-- Donation Status Node -->
  <g id="nodeDonationCheck" transform="translate(370, 355)" filter="url(#shadow)">
    <rect width="220" height="52" rx="10" fill="#1e293b" stroke="#a855f7" stroke-width="2"/>
    <text x="110" y="22" fill="#d8b4fe" font-size="10" font-weight="800" text-anchor="middle">💝 OPTIONAL READER DONATION</text>
    <text x="110" y="40" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">Is Donation Feature Active?</text>
  </g>

  <!-- Left: Donation Disabled -->
  <path d="M 370 381 L 340 381 L 340 432 L 360 432" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrowSlate)"/>
  <g transform="translate(350, 440)">
    <rect width="125" height="58" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="62" y="22" fill="#ef4444" font-size="10" font-weight="800" text-anchor="middle">DISABLED (0)</text>
    <text x="62" y="38" fill="#94a3b8" font-size="10" font-weight="600" text-anchor="middle">₹0 Donation</text>
    <text x="62" y="50" fill="#64748b" font-size="8.5" text-anchor="middle">Hidden at Checkout</text>
  </g>

  <!-- Right: Donation Enabled -->
  <path d="M 590 381 L 620 381 L 620 432 L 600 432" fill="none" stroke="#a855f7" stroke-width="1.8" marker-end="url(#arrowPurple)"/>
  <g transform="translate(485, 440)">
    <rect width="135" height="58" rx="8" fill="url(#aiGrad)" stroke="#c084fc" stroke-width="1.5"/>
    <text x="67" y="20" fill="#fae8ff" font-size="10" font-weight="800" text-anchor="middle">ENABLED (1)</text>
    <text x="67" y="36" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">Voluntary Tip (₹10+)</text>
    <text x="67" y="50" fill="#e9d5ff" font-size="8.5" text-anchor="middle">Girionix AI &amp; Server Fund</text>
  </g>

  <!-- ================= FOOTER SUMMARY BAR ================= -->
  <g transform="translate(40, 560)">
    <rect width="880" height="74" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    
    <g transform="translate(20, 18)">
      <circle cx="12" cy="18" r="10" fill="#10b981"/>
      <text x="12" y="22" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">1</text>
      <text x="32" y="14" fill="#f8fafc" font-size="11.5" font-weight="700">100% Direct Author Deposit</text>
      <text x="32" y="28" fill="#94a3b8" font-size="10">Author sets keys → 100% book revenue directly to author's bank via Razorpay.</text>
    </g>

    <g transform="translate(325, 18)">
      <circle cx="12" cy="18" r="10" fill="#f97316"/>
      <text x="12" y="22" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">2</text>
      <text x="32" y="14" fill="#f8fafc" font-size="11.5" font-weight="700">Platform Fallback</text>
      <text x="32" y="28" fill="#94a3b8" font-size="10">No author keys → defaults to platform developer gateway.</text>
    </g>

    <g transform="translate(610, 18)">
      <circle cx="12" cy="18" r="10" fill="#8b5cf6"/>
      <text x="12" y="22" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">3</text>
      <text x="32" y="14" fill="#f8fafc" font-size="11.5" font-weight="700">Optional Reader Tip</text>
      <text x="32" y="28" fill="#94a3b8" font-size="10">Separate donation fund for edge hosting &amp; Girionix AI.</text>
    </g>
  </g>
</svg>
