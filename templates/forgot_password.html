{% extends 'base.html' %}
{% block content %}
<div class="container">
    <div class="form-card" style="text-align: center;">
        <img src="{{ url_for('static', filename='PustakVerse.png') }}" alt="PustakVerse Logo" style="height: 90px; margin-bottom: 10px;">
        <h2 style="color: var(--navy); margin-top: 0;">Reset Password</h2>
        <p style="color: #64748b; margin-bottom: 20px;">Verify your identity to reset your password instantly.</p>
        <form method="POST" action="/forgot-password" style="text-align: left;">
            <label>Email Address:</label>
            <input type="email" name="email" placeholder="Enter your registered email..." required>
            <label>Security Question:</label>
            <select name="security_question" required>
                <option value="What is your pet's name?">What is your pet's name?</option>
                <option value="What is your favorite book?">What is your favorite book?</option>
                <option value="What city were you born in?">What city were you born in?</option>
                <option value="What is your favorite food?">What is your favorite food?</option>
            </select>
            <label>Security Answer:</label>
            <input type="text" name="security_answer" placeholder="Enter your answer..." required>
            <label>Create New Password:</label>
            <input type="password" name="new_password" placeholder="Enter a strong new password..." required>
            <button type="submit">Reset My Password</button>
        </form>
        <p style="margin-top: 20px;"><a href="{{ url_for('login') }}" style="color: var(--orange); text-decoration: none;">Back to Login</a></p>
    </div>
</div>
{% endblock %}
