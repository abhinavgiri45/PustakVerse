{% extends 'base.html' %}
{% block content %}

<style>
    :root {
        --primary-orange: #f66d2f;
        --primary-orange-hover: #e05c24;
        --card-bg: #ffffff;
    }

    .auth-wrapper { flex: 1; display: flex; align-items: center; justify-content: center; padding: 60px 20px; }
    .auth-box { background: var(--card-bg); width: 100%; max-width: 480px; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; margin: 0 auto; }

    .auth-box h2 { text-align: center; margin-top: 0; color: #2d3748; margin-bottom: 10px; font-size: 1.8rem; }
    .auth-box p { text-align: center; color: #718096; margin-bottom: 30px; font-size: 0.95rem; line-height: 1.5; }

    .form-group { margin-bottom: 20px; position: relative; }
    .form-group label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 0.9rem; color: #4a5568; }
    .form-group input, .form-group select { width: 100%; padding: 12px; border: 1px solid #cbd5e0; border-radius: 6px; box-sizing: border-box; font-size: 1rem; background: #f8fafc; transition: 0.2s; }
    .form-group input:focus, .form-group select:focus { outline: none; border-color: var(--primary-orange); background: white; box-shadow: 0 0 0 3px rgba(246, 109, 47, 0.1); }
    
    .toggle-password { position: absolute; right: 12px; top: 38px; cursor: pointer; font-size: 1.2rem; user-select: none; opacity: 0.7; }
    .toggle-password:hover { opacity: 1; }

    .btn-submit { width: 100%; padding: 14px; border: none; border-radius: 6px; font-weight: bold; font-size: 1.05rem; cursor: pointer; transition: 0.2s; color: white; margin-bottom: 10px; }
    .btn-submit.orange { background: var(--primary-orange); }
    .btn-submit.orange:hover { background: var(--primary-orange-hover); }
    .btn-submit.dark { background: #2d3748; }
    .btn-submit.dark:hover { background: #1a202c; }

    .back-link { display: block; text-align: center; margin-top: 15px; font-size: 0.9rem; color: var(--primary-orange); text-decoration: none; font-weight: 600; }
    .back-link:hover { text-decoration: underline; }

    @media (max-width: 768px) {
        .auth-box { padding: 25px; }
    }
</style>

<div class="auth-wrapper">
    <div class="auth-box">
        
        <div style="text-align: center; margin-bottom: 15px;">
            <img src="{{ url_for('static', filename='PustakVerse.png') }}" alt="Logo" style="height: 60px; max-width: 100%; object-fit: contain;">
        </div>
        
        <h2>Reset Password</h2>
        <p>Answer your security question to receive a reset code.</p>

        <!-- Step 1: Verification Form -->
        <form id="verifyForm" onsubmit="sendOtp(event)">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="reset_email" required placeholder="Enter your registered email">
            </div>
            <div class="form-group">
                <label>Security Question</label>
                <select id="reset_sec_q" required>
                    <option value="What is your favorite book?">What is your favorite book?</option>
                    <option value="What city were you born in?">What city were you born in?</option>
                    <option value="What is your mother's maiden name?">What is your mother's maiden name?</option>
                    <option value="What was the name of your first pet?">What was the name of your first pet?</option>
                </select>
            </div>
            <div class="form-group">
                <label>Security Answer</label>
                <input type="text" id="reset_sec_a" required placeholder="Enter your answer">
            </div>
            <button type="submit" id="btnSendOtp" class="btn-submit orange">Verify & Send Code</button>
            <a href="{{ url_for('login') }}" class="back-link">Return to Sign In</a>
        </form>

        <!-- Step 2: OTP & New Password Form -->
        <div id="otpSection" style="display: none;">
            <div id="otpTimerDisplay" style="text-align: center; font-weight: bold; color: #e53e3e; margin-bottom: 15px; font-size: 1.1rem;">
                Time remaining: 05:00
            </div>

            <div class="form-group">
                <label>Enter 6-Digit Code</label>
                <input type="text" id="reset_otp_input" placeholder="• • • • • •" autocomplete="off" style="letter-spacing: 5px; font-size: 1.2rem; text-align: center;">
            </div>

            <div class="form-group">
                <label>Create New Password</label>
                <input type="password" id="new_password" required minlength="6" placeholder="Enter new password">
                <span class="toggle-password" onclick="togglePassword('new_password', this)">👁️</span>
            </div>

            <button type="button" id="btnVerifyOtp" onclick="verifyOtp()" class="btn-submit orange">Reset Password</button>
            <button type="button" id="btnResendOtp" onclick="resendOtp()" class="btn-submit dark" disabled style="opacity: 0.5;">Resend Code (wait 60s)</button>
        </div>

    </div>
</div>

<script>
    function togglePassword(fieldId, iconElement) {
        const field = document.getElementById(fieldId);
        if (field.type === "password") {
            field.type = "text";
            iconElement.textContent = "🙈"; 
        } else {
            field.type = "password";
            iconElement.textContent = "👁️"; 
        }
    }

    let otpInterval;
    let timeLeft = 300;

    function startOtpTimer() {
        clearInterval(otpInterval);
        timeLeft = 300; 
        const resendBtn = document.getElementById('btnResendOtp');
        resendBtn.disabled = true;
        resendBtn.style.opacity = '0.5';
        
        otpInterval = setInterval(() => {
            timeLeft--;
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            document.getElementById('otpTimerDisplay').textContent = `Time remaining: 0${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
            
            if (timeLeft <= 240) {
                resendBtn.disabled = false;
                resendBtn.style.opacity = '1';
                resendBtn.textContent = "Resend Code";
            } else {
                resendBtn.textContent = `Resend Code (wait ${timeLeft - 240}s)`;
            }

            if (timeLeft <= 0) {
                clearInterval(otpInterval);
                document.getElementById('otpTimerDisplay').textContent = "Code Expired. Please resend.";
            }
        }, 1000);
    }

    async function sendOtp(e) {
        e.preventDefault();
        const btn = document.getElementById('btnSendOtp');
        btn.disabled = true;
        btn.textContent = "Verifying...";

        const payload = {
            action: 'send_otp',
            email: document.getElementById('reset_email').value,
            security_question: document.getElementById('reset_sec_q').value,
            security_answer: document.getElementById('reset_sec_a').value
        };

        try {
            const response = await fetch('/forgot-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await response.json();
            
            if (data.success) {
                document.getElementById('verifyForm').style.display = 'none';
                document.getElementById('otpSection').style.display = 'block';
                startOtpTimer();
            } else {
                alert(data.message);
                btn.disabled = false;
                btn.textContent = "Verify & Send Code";
            }
        } catch (err) {
            alert("Network error.");
            btn.disabled = false;
            btn.textContent = "Verify & Send Code";
        }
    }

    async function verifyOtp() {
        const btn = document.getElementById('btnVerifyOtp');
        const otpVal = document.getElementById('reset_otp_input').value;
        const newPass = document.getElementById('new_password').value;

        if (!otpVal || !newPass) return alert("Please enter both the code and a new password.");
        if (newPass.length < 6) return alert("Password must be at least 6 characters.");

        btn.disabled = true;
        btn.textContent = "Updating Password...";

        try {
            const response = await fetch('/forgot-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'verify_otp', otp: otpVal, new_password: newPass })
            });
            const data = await response.json();
            
            if (data.success) {
                alert(data.message);
                window.location.href = data.redirect;
            } else {
                alert(data.message);
                btn.disabled = false;
                btn.textContent = "Reset Password";
            }
        } catch (err) {
            alert("Network error.");
            btn.disabled = false;
            btn.textContent = "Reset Password";
        }
    }

    async function resendOtp() {
        const btn = document.getElementById('btnResendOtp');
        btn.disabled = true;
        btn.textContent = "Resending...";

        try {
            const response = await fetch('/forgot-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'resend_otp' })
            });
            const data = await response.json();
            
            if (data.success) {
                startOtpTimer();
            } else {
                alert(data.message);
                btn.disabled = false;
                btn.textContent = "Resend Code";
            }
        } catch (err) {
            alert("Network error.");
            btn.disabled = false;
            btn.textContent = "Resend Code";
        }
    }
</script>
{% endblock %}
