{% extends 'base.html' %}
{% block content %}
<style>
    .auth-container { max-width: 480px; margin: 40px auto; padding: 20px; }
    .form-card { background: #ffffff; border-radius: 16px; padding: 36px 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; }
    .form-card h2 { color: #1e293b; margin: 10px 0 6px 0; font-size: 1.6rem; font-weight: 800; text-align: center; }
    .form-card p { color: #64748b; font-size: 0.92rem; text-align: center; margin-bottom: 24px; }
    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; font-weight: 600; font-size: 0.88rem; color: #475569; margin-bottom: 6px; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; font-size: 0.95rem; font-family: inherit; transition: 0.2s; background: #f8fafc; }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: #ea580c; background: #ffffff; outline: none; box-shadow: 0 0 0 3px rgba(234,88,12,0.15); }
    .btn-submit { width: 100%; background: #ea580c; color: white; padding: 13px; border: none; border-radius: 8px; font-weight: 700; font-size: 1.05rem; cursor: pointer; transition: 0.2s; margin-top: 10px; }
    .btn-submit:hover { background: #c2410c; }
    .btn-google { display: flex; align-items: center; justify-content: center; width: 100%; background-color: #ffffff; color: #3c4043; border: 1px solid #dadce0; padding: 12px; border-radius: 8px; font-weight: 600; font-size: 1rem; text-decoration: none; transition: 0.2s; box-sizing: border-box; }
    .btn-google:hover { background-color: #f8f9fa; box-shadow: 0 1px 3px rgba(60,64,67,0.3); border-color: #d2e3fc;}
    .google-icon { width: 20px; height: 20px; margin-right: 10px; }
    .divider { display: flex; align-items: center; text-align: center; margin: 20px 0; color: #94a3b8; font-size: 0.85rem; }
    .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid #e2e8f0; }
    .divider span { padding: 0 10px; }
    .switch-link { text-align: center; margin-top: 20px; font-size: 0.9rem; color: #64748b; }
    .switch-link a { color: #ea580c; font-weight: 600; text-decoration: none; }
    .switch-link a:hover { text-decoration: underline; }
</style>

<div class="auth-container">
    <div class="form-card">
        <div style="text-align: center;">
            <img src="{{ url_for('static', filename='PustakVerse.png') }}" alt="PustakVerse Logo" style="height: 52px; width: auto; object-fit: contain;">
        </div>
        <h2>Create an Account</h2>
        <p>Join the open universe of knowledge & literature</p>

        <a href="/login/google?mode=signup" class="btn-google">
            <svg class="google-icon" viewBox="0 0 24 24">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            Sign up with Google
        </a>

        <div class="divider"><span>or register with email</span></div>

        <form id="directRegisterForm" method="POST" action="/register" onsubmit="handleDirectRegister(event)">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label for="reg_u">Choose Username</label>
                <input type="text" id="reg_u" name="username" required placeholder="Choose a unique username">
                <span id="reg_u_status" style="font-size: 0.8rem; margin-top: 4px; display: block;"></span>
            </div>
            <div class="form-group">
                <label for="reg_e">Email Address</label>
                <input type="email" id="reg_e" name="email" required placeholder="name@example.com">
            </div>
            <div class="form-group">
                <label for="reg_p">Password</label>
                <input type="password" id="reg_p" name="password" required minlength="6" placeholder="At least 6 characters">
            </div>
            <div class="form-group">
                <label for="reg_role">Account Type</label>
                <select id="reg_role" name="role" onchange="toggleAuthorReasonDirect()">
                    <option value="reader">Reader (Access & Read All Books)</option>
                    <option value="author">Author (Publish Books to Library)</option>
                </select>
            </div>
            <div class="form-group" id="authorGroupDirect" style="display: none; background: #fffaf0; padding: 12px; border-radius: 8px; border: 1px solid #fbd38d;">
                <label style="color: #c05621;">Author Purpose / Published Titles</label>
                <textarea name="verification_reason" rows="2" placeholder="Tell us about your writing or published books..."></textarea>
            </div>
            <div class="form-group">
                <label for="reg_sq">Security Question (Password Recovery)</label>
                <select id="reg_sq" name="security_question" required>
                    <option value="What is your favorite book?">What is your favorite book?</option>
                    <option value="What city were you born in?">What city were you born in?</option>
                    <option value="What is your mother's maiden name?">What is your mother's maiden name?</option>
                    <option value="What was the name of your first pet?">What was the name of your first pet?</option>
                </select>
            </div>
            <div class="form-group">
                <label for="reg_sa">Security Answer</label>
                <input type="text" id="reg_sa" name="security_answer" placeholder="Your secret answer" required>
            </div>

            <button type="submit" id="btnSubmitReg" class="btn-submit">Create Free Account</button>
        </form>

        <div class="switch-link">
            Already have an account? <a href="/login">Sign In</a>
        </div>
    </div>
</div>

<script>
    function toggleAuthorReasonDirect() {
        const role = document.getElementById('reg_role').value;
        const group = document.getElementById('authorGroupDirect');
        if (group) group.style.display = (role === 'author') ? 'block' : 'none';
    }

    const uInput = document.getElementById('reg_u');
    const uStatus = document.getElementById('reg_u_status');
    let uTimer = null;
    if (uInput && uStatus) {
        uInput.addEventListener('input', function() {
            clearTimeout(uTimer);
            const val = this.value.trim();
            if (val.length < 3) { uStatus.textContent = ''; return; }
            uStatus.innerHTML = '<span style="color: #64748b;">Checking...</span>';
            uTimer = setTimeout(() => {
                fetch('/check_username', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: val })
                })
                .then(r => r.json())
                .then(d => {
                    uStatus.innerHTML = d.available ? `<span style="color: #16a34a;">✓ ${d.message}</span>` : `<span style="color: #dc2626;">✗ ${d.message}</span>`;
                })
                .catch(() => {});
            }, 400);
        });
    }

    async function handleDirectRegister(e) {
        e.preventDefault();
        const btn = document.getElementById('btnSubmitReg');
        btn.disabled = true;
        btn.textContent = "Creating Account...";

        const payload = {
            action: 'register',
            username: document.getElementById('reg_u').value,
            email: document.getElementById('reg_e').value,
            password: document.getElementById('reg_p').value,
            role: document.getElementById('reg_role').value,
            security_question: document.getElementById('reg_sq').value,
            security_answer: document.getElementById('reg_sa').value,
            verification_reason: document.querySelector('textarea[name="verification_reason"]')?.value || ''
        };

        try {
            const res = await fetch('/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            if (data.success) {
                sessionStorage.setItem('pustakverse_intro_seen', 'true');
                localStorage.setItem('pustakverse_onboarded', 'true');
                btn.textContent = "✓ Account Created! Logging in...";
                btn.style.background = "#16a34a";
                setTimeout(() => {
                    window.location.href = data.redirect || "/";
                }, 800);
            } else {
                alert(data.message || "Registration failed.");
                btn.disabled = false;
                btn.textContent = "Create Free Account";
            }
        } catch (_) {
            // Fallback to standard form submit
            document.getElementById('directRegisterForm').submit();
        }
    }
</script>
{% endblock %}
