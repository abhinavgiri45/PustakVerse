{% extends 'base.html' %}
{% block content %}
<div class="container">
    <div class="form-card" style="text-align: center;">
        <img src="{{ url_for('static', filename='PustakVerse.png') }}" alt="PustakVerse Logo" style="height: 64px; width: auto; object-fit: contain; margin-bottom: 10px;">
        <a href="/login/google?mode=signup" class="btn-google" style="margin: 15px 0 20px 0; text-decoration: none;">
            <svg class="google-icon" viewBox="0 0 24 24">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            Sign up with Google (Fast & Verified)
        </a>
        <div style="display: flex; align-items: center; text-align: center; margin: 15px 0; color: #a0aec0; font-size: 0.9rem;">
            <div style="flex: 1; border-bottom: 1px solid #e2e8f0;"></div>
            <span style="padding: 0 10px;">or create with email</span>
            <div style="flex: 1; border-bottom: 1px solid #e2e8f0;"></div>
        </div>
        <form method="POST" action="/register" style="text-align: left;">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label>Username:</label>
            <input type="text" name="username" required>
            <label>Email Address:</label>
            <input type="email" name="email" required>
            <label>Password:</label>
            <input type="password" name="password" required>
            <label>Security Question (In case you forget your password):</label>
            <select name="security_question" required>
                <option value="What is your pet's name?">What is your pet's name?</option>
                <option value="What is your favorite book?">What is your favorite book?</option>
                <option value="What city were you born in?">What city were you born in?</option>
                <option value="What is your favorite food?">What is your favorite food?</option>
            </select>
            <label>Security Answer:</label>
            <input type="text" name="security_answer" placeholder="e.g. Harry Potter" required>
            <label>I am a:</label>
            <select name="role">
                <option value="reader">Reader</option>
                <option value="author">Author</option>
            </select>
            <label style="color: var(--orange);">If registering as an Author, state your purpose / books:</label>
            <textarea name="verification_reason" rows="3" placeholder="Tell us about your writing or published books..." style="padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; width: 100%; box-sizing: border-box; font-family: inherit; margin-bottom: 15px; margin-top: 8px;"></textarea>
            <button type="submit">Register</button>
        </form>
    </div>
</div>
{% endblock %}
