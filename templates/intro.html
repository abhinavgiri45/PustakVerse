<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to PustakVerse</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='PustakVerse.png') }}">
    <style>
        /* Prevent all scrolling, bouncing, and white flashes */
        body, html {
            margin: 0; padding: 0; height: 100vh; width: 100vw;
            background-color: #0f172a; /* Deep cinematic background */
            color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            overflow: hidden;
        }

        .cinematic-container {
            text-align: center;
            opacity: 0;
            animation: fadeIn 1.5s ease-in forwards;
            padding: 20px;
        }

        .logo {
            height: 100px;
            max-width: 90vw;
            object-fit: contain;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 15px rgba(246, 109, 47, 0.4));
            animation: pulseLogo 4s infinite alternate;
        }

        .tagline {
            font-size: 2rem;
            font-weight: 400;
            letter-spacing: 1px;
            margin: 0;
            opacity: 0;
            animation: slideUp 1.5s ease-out 1s forwards;
            color: #f8fafc;
        }

        .sub-tagline {
            font-size: 1.1rem;
            color: #94a3b8;
            margin-top: 15px;
            opacity: 0;
            animation: slideUp 1.5s ease-out 2s forwards;
        }

        .skip-btn {
            position: absolute;
            bottom: 50px;
            background: transparent;
            color: #94a3b8;
            border: 1px solid #64748b;
            padding: 10px 25px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 0.95rem;
            transition: 0.3s;
            opacity: 0;
            animation: fadeIn 1s ease-in 2.5s forwards;
        }

        .skip-btn:hover {
            color: white;
            border-color: #f66d2f;
            background: rgba(246, 109, 47, 0.1);
        }

        /* Fluid Animations */
        @keyframes fadeIn { 0% { opacity: 0; } 100% { opacity: 1; } }
        @keyframes slideUp { 0% { opacity: 0; transform: translateY(20px); } 100% { opacity: 1; transform: translateY(0); } }
        @keyframes pulseLogo { 0% { transform: scale(0.98); } 100% { transform: scale(1.02); } }
        
        /* Mobile Responsiveness */
        @media (max-width: 600px) {
            .tagline { font-size: 1.5rem; }
            .sub-tagline { font-size: 0.95rem; }
            .logo { height: 80px; }
        }
    </style>
</head>
<body>
    <div class="cinematic-container">
        <img src="{{ url_for('static', filename='PustakVerse.png') }}" alt="PustakVerse Logo" class="logo">
        <!-- These now pull directly from your Developer Dashboard! -->
        <h1 class="tagline">{{ site_settings.intro_tagline }}</h1>
        <p class="sub-tagline">{{ site_settings.intro_sub_tagline }}</p>
    </div>

    <!-- Smart button text based on session status -->
    <button class="skip-btn" onclick="goToNext()">
        {% if session.get('user_id') %} Skip to Library {% else %} Skip Intro {% endif %}
    </button>

    <script>
        const timeoutId = setTimeout(() => {
            goToNext();
        }, 5500);

        function goToNext() {
            clearTimeout(timeoutId);
            // If they are logged in, go straight to the library! 
            // If they are logged out, push to login page.
            {% if session.get('user_id') %}
                window.location.replace("/"); 
            {% else %}
                window.location.replace("/login?first_time=true"); 
            {% endif %}
        }
    </script>
</body>
</html>
