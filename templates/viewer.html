<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{{ book.title }} — PustakVerse Reader</title>
    
    <!-- FAVICON -->
    <link rel="icon" href="{{ url_for('static', filename='images/favicon.ico') if book else '/static/favicon.ico' }}" type="image/x-icon">
    
    <!-- FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- PDF.JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
    
    <style>
        :root {
            --viewer-bg: #090d16;
            --topbar-bg: #0f172a;
            --topbar-border: #1e293b;
            --accent-orange: #ea580c;
            --accent-green: #10b981;
            --text-primary: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--viewer-bg);
            color: var(--text-primary);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            user-select: none;
        }

        /* --- CLEAN STREAMLINED NAVBAR --- */
        .reader-navbar {
            height: 52px;
            background: var(--topbar-bg);
            border-bottom: 1px solid var(--topbar-border);
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            padding: 0 16px;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            flex-shrink: 0;
        }

        /* LEFT: RETURN & TITLE */
        .nav-left {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .btn-library {
            background: #1e293b;
            color: #e2e8f0;
            border: 1px solid #334155;
            padding: 6px 12px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.84rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
            white-space: nowrap;
            cursor: pointer;
        }
        .btn-library:hover {
            background: #334155;
            color: #ffffff;
            border-color: #475569;
            transform: translateX(-1px);
        }

        .book-title {
            font-size: 0.92rem;
            font-weight: 700;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 320px;
        }

        /* CENTER: PAGE JUMP & ZOOM */
        .nav-center {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #1e293b;
            padding: 4px 10px;
            border-radius: 10px;
            border: 1px solid #334155;
        }

        .nav-btn {
            background: transparent;
            color: #cbd5e1;
            border: none;
            padding: 4px 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
        }
        .nav-btn:hover:not(:disabled) {
            background: #334155;
            color: #ffffff;
        }
        .nav-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        .page-input {
            width: 44px;
            background: #0f172a;
            border: 1px solid #475569;
            color: #ffffff;
            text-align: center;
            font-size: 0.85rem;
            font-weight: 700;
            padding: 3px 4px;
            border-radius: 6px;
            outline: none;
        }
        .page-input:focus {
            border-color: #ea580c;
        }
        .page-total {
            font-size: 0.82rem;
            color: #94a3b8;
            font-weight: 600;
        }

        /* RIGHT: THEME, CERTIFICATE, FULLSCREEN */
        .nav-right {
            display: flex;
            align-items: center;
            gap: 8px;
            justify-content: flex-end;
        }

        .pill-btn {
            background: #1e293b;
            color: #e2e8f0;
            border: 1px solid #334155;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
            text-decoration: none;
        }
        .pill-btn:hover {
            background: #334155;
            color: #ffffff;
            border-color: #475569;
        }

        .pill-cert {
            background: linear-gradient(135deg, #059669 0%, #10b981 100%);
            color: white;
            border: none;
            box-shadow: 0 0 14px rgba(16, 185, 129, 0.4);
            display: none;
        }

        /* --- MAIN VIEWPORT --- */
        .reader-viewport {
            height: calc(100vh - 52px);
            width: 100%;
            overflow-y: auto;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 16px;
            background: #090d16;
            position: relative;
            scroll-behavior: smooth;
        }

        #pagesContainer {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 960px;
            margin: 0 auto;
        }

        .page-card {
            margin-bottom: 28px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            width: 100%;
        }

        .pdf-canvas {
            box-shadow: 0 12px 35px rgba(0,0,0,0.65);
            border-radius: 6px;
            background: #ffffff;
            transition: filter 0.2s, transform 0.2s;
            max-width: 100%;
            height: auto !important;
            display: block;
        }

        .page-badge {
            margin-top: 8px;
            font-size: 0.76rem;
            color: #64748b;
            font-weight: 600;
        }

        /* THEMES */
        body.theme-sepia .reader-viewport { background-color: #f4ecd8; }
        body.theme-sepia .pdf-canvas { filter: sepia(0.35) contrast(0.95); }
        body.theme-sepia .page-badge { color: #8c7355; }
        
        body.theme-light .reader-viewport { background-color: #e2e8f0; }
        body.theme-light .pdf-canvas { filter: none; }
        body.theme-light .page-badge { color: #64748b; }

        body.theme-dark .reader-viewport { background-color: #090d16; }
        body.theme-dark .pdf-canvas { filter: contrast(1.02); }
        body.theme-dark .page-badge { color: #64748b; }

        /* LOADING SPINNER */
        .loading-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 65vh;
            color: #94a3b8;
            gap: 16px;
            width: 100%;
        }
        .spinner-ring {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(234, 88, 12, 0.2);
            border-top-color: #ea580c;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ERROR STATE */
        .error-box {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 60vh;
            text-align: center;
            color: #f87171;
            padding: 20px;
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .book-title { max-width: 140px; font-size: 0.82rem; }
            .reader-navbar { padding: 0 8px; }
            .nav-center { gap: 4px; padding: 3px 6px; }
        }
    </style>
</head>
<body class="theme-dark">

    <!-- TOP NAVBAR -->
    <nav class="reader-navbar">
        <!-- LEFT -->
        <div class="nav-left">
            <a href="{{ url_for('index') }}" class="btn-library" title="Return to Library">
                <span>&larr;</span> Library
            </a>
            <span class="book-title" title="{{ book.title }}">{{ book.title }}</span>
        </div>

        <!-- CENTER -->
        <div class="nav-center">
            <button class="nav-btn" onclick="changePage(-1)" title="Previous Page (&larr;)">◀</button>
            <input type="number" id="pageNumberInput" class="page-input" value="1" min="1" onchange="jumpToPage(this.value)">
            <span class="page-total" id="totalPagesDisplay">/ ...</span>
            <button class="nav-btn" onclick="changePage(1)" title="Next Page (&rarr;)">▶</button>
            
            <div style="width: 1px; height: 16px; background: #475569; margin: 0 4px;"></div>
            
            <button class="nav-btn" onclick="adjustZoom(-0.15)" title="Zoom Out (−)">−</button>
            <span id="zoomDisplayText" style="font-size: 0.78rem; font-weight: 700; color: #cbd5e1; min-width: 36px; text-align: center;">100%</span>
            <button class="nav-btn" onclick="adjustZoom(0.15)" title="Zoom In (+)">+</button>
            <button class="nav-btn" onclick="fitWidth()" title="Fit Width" style="font-size: 0.75rem; padding: 3px 6px;">Fit</button>
        </div>

        <!-- RIGHT -->
        <div class="nav-right">
            <button class="pill-btn" onclick="cycleTheme()" title="Switch Theme">
                <span id="themeEmoji">🌙</span>
            </button>

            <a href="{{ url_for('generate_reading_certificate', book_id=book.id) }}" class="pill-btn pill-cert" id="certBtn" title="Verified Certificate">
                🎓 Certificate
            </a>

            <button class="pill-btn" onclick="toggleFullscreen()" title="Fullscreen Mode (F)">
                ⛶
            </button>
        </div>
    </nav>

    <!-- VIEWPORT CONTAINER -->
    <div class="reader-viewport" id="viewportScrollArea">
        
        <!-- LOADING SPINNER -->
        <div id="loadingIndicator" class="loading-box">
            <div class="spinner-ring"></div>
            <div style="margin-top: 14px; font-weight: 600; font-size: 1rem; color: #f8fafc;" id="loadingStatusText">Connecting to PustakVerse Cloud...</div>
            <div style="width: 240px; height: 6px; background: #334155; border-radius: 999px; margin: 12px auto 0; overflow: hidden;">
                <div id="loadingBar" style="width: 25%; height: 100%; background: linear-gradient(90deg, #ea580c, #10b981); transition: width 0.25s ease;"></div>
            </div>
        </div>

        <!-- ERROR BOX -->
        <div id="errorIndicator" class="error-box">
            <div style="font-size: 2.5rem; margin-bottom: 12px;">⚠️</div>
            <div style="font-size: 1.1rem; font-weight: 700; color: #f8fafc; margin-bottom: 8px;">Unable to Stream PDF Document</div>
            <p style="color: #94a3b8; font-size: 0.9rem; max-width: 420px; line-height: 1.5; margin-bottom: 16px;" id="errorMessageText">
                The server took longer than expected to download this file from cloud storage.
            </p>
            <button onclick="location.reload()" class="pill-btn" style="background: #ea580c; border: none; color: white;">
                🔄 Retry Opening
            </button>
        </div>

        <!-- CANVAS PAGES CONTAINER -->
        <div id="pagesContainer"></div>
    </div>

    <script>
        // GLOBAL ERROR HANDLER
        window.addEventListener('error', function(e) {
            console.error("Reader Script Error:", e.message, e.filename, e.lineno);
            const statusEl = document.getElementById('loadingStatusText');
            if (statusEl && statusEl.textContent.includes('Connecting')) {
                statusEl.textContent = "Loading Engine: " + (e.message || 'Initializing...');
            }
        });

        let pdfDoc = null;
        let currentPageNum = 1;
        let totalPages = 1;
        let currentScale = 1.25;
        let isCompleted = false;
        let activeReadingSeconds = 0;
        const renderedPages = new Set();
        const pdfUrl = "{{ url_for('serve_secure_pdf', book_id=book.id) }}";

        // Helper to get PDF.js instance safely
        function getPdfLib() {
            return window.pdfjsLib || window['pdfjs-dist/build/pdf'] || null;
        }

        // Load PDF Document via Progressive Stream Reader
        async function loadPdfDocument() {
            const loadingEl = document.getElementById('loadingIndicator');
            const errorEl = document.getElementById('errorIndicator');
            const pBar = document.getElementById('loadingBar');
            const pText = document.getElementById('loadingStatusText');

            try {
                if (pText) pText.textContent = "Connecting to PustakVerse Cloud...";
                if (pBar) pBar.style.width = "20%";

                const response = await fetch(pdfUrl);
                if (!response.ok) throw new Error(`HTTP Error ${response.status}: ${response.statusText || 'Could not stream document'}`);

                const contentLength = response.headers.get('Content-Length');
                const total = contentLength ? parseInt(contentLength, 10) : 0;
                let loaded = 0;

                const reader = response.body.getReader();
                const chunks = [];

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    chunks.push(value);
                    loaded += value.length;
                    if (total > 0) {
                        const pct = Math.min(99, Math.round((loaded / total) * 100));
                        if (pBar) pBar.style.width = `${pct}%`;
                        if (pText) pText.textContent = `Downloading Book (${pct}%)...`;
                    } else {
                        const mb = (loaded / (1024 * 1024)).toFixed(1);
                        if (pText) pText.textContent = `Streaming Book (${mb} MB)...`;
                    }
                }

                if (pText) pText.textContent = "Rendering Pages...";
                if (pBar) pBar.style.width = "100%";

                // Concatenate into single Uint8Array
                const allBytes = new Uint8Array(loaded);
                let offset = 0;
                for (const chunk of chunks) {
                    allBytes.set(chunk, offset);
                    offset += chunk.length;
                }

                // Initialize PDF.js
                const pdfjs = getPdfLib();
                if (!pdfjs) throw new Error("PDF.js rendering engine could not be initialized from CDN.");

                if (pdfjs.GlobalWorkerOptions) {
                    pdfjs.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
                }

                const loadingTask = pdfjs.getDocument({
                    data: allBytes,
                    cMapUrl: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/cmaps/',
                    cMapPacked: true
                });

                pdfDoc = await loadingTask.promise;
                totalPages = pdfDoc.numPages;
                document.getElementById('totalPagesDisplay').textContent = `/ ${totalPages}`;
                document.getElementById('pageNumberInput').max = totalPages;
                
                if (loadingEl) loadingEl.style.display = 'none';

                // Resume saved page
                const urlParams = new URLSearchParams(window.location.search);
                const startPage = parseInt(urlParams.get('page') || '1', 10);
                currentPageNum = Math.min(Math.max(1, startPage), totalPages);
                document.getElementById('pageNumberInput').value = currentPageNum;

                buildPageContainers();
                jumpToPage(currentPageNum, false);
                recordProgress(currentPageNum);
                fetchCompletionStatus();
                setupScrollObserver();
            } catch (err) {
                console.error("Fatal PDF load error:", err);
                if (loadingEl) loadingEl.style.display = 'none';
                if (errorEl) {
                    errorEl.style.display = 'flex';
                    const msgEl = document.getElementById('errorMessageText');
                    if (msgEl) msgEl.textContent = err.message || "Failed to load document from cloud.";
                }
            }
        }

        // Build Page Containers
        function buildPageContainers() {
            const container = document.getElementById('pagesContainer');
            if (!container || !pdfDoc) return;
            container.innerHTML = '';
            renderedPages.clear();

            for (let i = 1; i <= totalPages; i++) {
                const card = document.createElement('div');
                card.id = `pageCard_${i}`;
                card.className = 'page-card';
                card.dataset.pageNum = i;

                const canvas = document.createElement('canvas');
                canvas.id = `pageCanvas_${i}`;
                canvas.className = 'pdf-canvas';
                
                const baseWidth = Math.min(window.innerWidth - 48, 850) * (currentScale / 1.25);
                canvas.width = baseWidth;
                canvas.height = baseWidth * 1.3;
                canvas.style.width = `${baseWidth}px`;

                const badge = document.createElement('div');
                badge.className = 'page-badge';
                badge.textContent = `Page ${i} of ${totalPages}`;

                card.appendChild(canvas);
                card.appendChild(badge);
                container.appendChild(card);
            }
        }

        // Lazy Scroll Observer
        let observer = null;
        function setupScrollObserver() {
            if (observer) observer.disconnect();

            const scrollContainer = document.getElementById('viewportScrollArea');
            observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const pageNum = parseInt(entry.target.dataset.pageNum, 10);
                    if (entry.isIntersecting) {
                        if (!renderedPages.has(pageNum)) {
                            renderPage(pageNum);
                        }
                        currentPageNum = pageNum;
                        document.getElementById('pageNumberInput').value = currentPageNum;
                        recordProgress(currentPageNum);
                    }
                });
            }, {
                root: scrollContainer,
                rootMargin: '300px 0px',
                threshold: 0.1
            });

            document.querySelectorAll('.page-card').forEach(el => observer.observe(el));
        }

        async function renderPage(pageNum) {
            if (!pdfDoc || pageNum < 1 || pageNum > totalPages) return;
            const canvas = document.getElementById(`pageCanvas_${pageNum}`);
            if (!canvas) return;

            try {
                const page = await pdfDoc.getPage(pageNum);
                const viewport = page.getViewport({ scale: currentScale });
                const ctx = canvas.getContext('2d');
                
                const outputScale = window.devicePixelRatio || 1;
                canvas.width = Math.floor(viewport.width * outputScale);
                canvas.height = Math.floor(viewport.height * outputScale);
                canvas.style.width = `${Math.floor(viewport.width)}px`;
                canvas.style.height = `${Math.floor(viewport.height)}px`;

                const transform = outputScale !== 1 ? [outputScale, 0, 0, outputScale, 0, 0] : null;
                const renderContext = {
                    canvasContext: ctx,
                    transform: transform,
                    viewport: viewport
                };

                await page.render(renderContext).promise;
                renderedPages.add(pageNum);
            } catch (err) {
                console.error(`Error rendering page ${pageNum}:`, err);
            }
        }

        function changePage(delta) {
            const target = currentPageNum + delta;
            if (target >= 1 && target <= totalPages) {
                jumpToPage(target, true);
            }
        }

        function jumpToPage(pageNum, smooth = true) {
            const num = parseInt(pageNum, 10);
            if (num >= 1 && num <= totalPages) {
                currentPageNum = num;
                document.getElementById('pageNumberInput').value = currentPageNum;
                const targetCard = document.getElementById(`pageCard_${currentPageNum}`);
                if (targetCard) {
                    targetCard.scrollIntoView({ behavior: smooth ? 'smooth' : 'auto', block: 'start' });
                    renderPage(currentPageNum);
                }
                recordProgress(currentPageNum);
                syncReadingProgress(0);
            }
        }

        function adjustZoom(delta) {
            currentScale = Math.max(0.75, Math.min(2.5, currentScale + delta));
            document.getElementById('zoomDisplayText').textContent = `${Math.round(currentScale * 80)}%`;
            reRenderAllPages();
        }

        function fitWidth() {
            const viewportWidth = window.innerWidth - 60;
            currentScale = Math.max(0.85, Math.min(2.2, viewportWidth / 850));
            document.getElementById('zoomDisplayText').textContent = `Fit`;
            reRenderAllPages();
        }

        function reRenderAllPages() {
            renderedPages.clear();
            buildPageContainers();
            setupScrollObserver();
            jumpToPage(currentPageNum, false);
        }

        // Reading Tracking
        function fetchCompletionStatus() {
            fetch(`/api/reading_progress?book_id={{ book.id }}`)
                .then(r => r.json())
                .then(data => {
                    if (data.success && data.is_completed) {
                        isCompleted = true;
                        const certBtn = document.getElementById('certBtn');
                        if (certBtn) certBtn.style.display = 'inline-flex';
                    }
                })
                .catch(() => {});
        }

        function syncReadingProgress(addedSeconds = 5) {
            fetch('/api/reading_progress', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    book_id: {{ book.id }},
                    current_page: currentPageNum,
                    total_pages: totalPages,
                    time_spent_seconds: addedSeconds
                })
            })
            .then(r => r.json())
            .then(data => {
                if (data.success && data.is_completed) {
                    isCompleted = true;
                    const certBtn = document.getElementById('certBtn');
                    if (certBtn) certBtn.style.display = 'inline-flex';
                }
            })
            .catch(() => {});
        }

        // Heartbeat
        let heartbeatTimer = setInterval(() => {
            if (document.visibilityState === 'visible') {
                activeReadingSeconds += 15;
                syncReadingProgress(15);
            }
        }, 15000);

        function recordProgress(page) {
            try {
                localStorage.setItem(`pustakverse_resume_{{ book.id }}`, JSON.stringify({
                    book_id: {{ book.id }},
                    page: page,
                    title: "{{ book.title }}",
                    cover: "{{ book.cover_image or '' }}",
                    updated_at: new Date().toISOString()
                }));
            } catch(e) {}
        }

        // Themes
        const themes = ['theme-dark', 'theme-sepia', 'theme-light'];
        let currentThemeIdx = 0;
        function cycleTheme() {
            document.body.classList.remove(themes[currentThemeIdx]);
            currentThemeIdx = (currentThemeIdx + 1) % themes.length;
            document.body.classList.add(themes[currentThemeIdx]);
            const icons = ['🌙', '📜', '☀️'];
            document.getElementById('themeEmoji').textContent = icons[currentThemeIdx];
        }

        // Fullscreen
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }

        // Shortcuts
        window.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            if (e.key === 'ArrowRight' || e.key === 'PageDown') { changePage(1); }
            if (e.key === 'ArrowLeft' || e.key === 'PageUp') { changePage(-1); }
            if (e.key === 'f' || e.key === 'F') { toggleFullscreen(); }
        });

        // Initialize immediately
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', loadPdfDocument);
        } else {
            loadPdfDocument();
        }
    </script>
</body>
</html>
